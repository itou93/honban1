<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>校舎内 WebAR 学科紹介</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body { 
            margin: 0; padding: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden; font-family: sans-serif; 
            background-color: #000000 !important; 
        }
        #ar-container, a-scene {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important; height: 100dvh !important;
            z-index: 1 !important; overflow: hidden !important;
        }
        .btn-back {
            position: fixed; top: 20px; left: 20px; z-index: 10000;
            background-color: rgba(0, 0, 0, 0.6); color: #ffffff;
            padding: 10px 18px; border-radius: 20px; text-decoration: none;
            font-weight: bold; font-size: 16px; border: 2px solid #ffffff;
        }
        .floor-selector {
            position: fixed; top: 20px; right: 20px; z-index: 10000;
            display: flex; gap: 6px; background: rgba(0, 0, 0, 0.6);
            padding: 6px; border-radius: 20px; border: 2px solid #ffffff;
        }
        .floor-btn {
            background: transparent; color: white; border: none;
            padding: 8px 12px; border-radius: 12px; font-weight: bold;
            font-size: 14px; cursor: pointer;
        }
        .floor-btn.active { background: #10b981; color: white; }
        .mindar-ui-overlay, .mindar-ui-scanning { display: none !important; }
        .stamp-dialog-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7); z-index: 20000; display: none;
            align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .stamp-dialog-box {
            background: #ffffff; width: 85%; max-width: 340px;
            border-radius: 20px; padding: 24px 20px; text-align: center;
        }
    </style>
</head>
<body>

    <a href="videoMaya.html" class="btn-back">← 戻る</a>

    <div class="floor-selector">
        <button id="btn-1f" class="floor-btn" onclick="switchFloor('1f')">1F</button>
        <button id="btn-2f" class="floor-btn" onclick="switchFloor('2f')">2F</button>
        <button id="btn-3f" class="floor-btn" onclick="switchFloor('3f')">3F</button>
        <button id="btn-4f" class="floor-btn" onclick="switchFloor('4f')">4F</button>
        <button id="btn-5f" class="floor-btn" onclick="switchFloor('5f')">5F</button>
    </div>

    <!-- ここに ar-container を確実に配置 -->
    <div id="ar-container"></div>

    <div id="stamp-dialog" class="stamp-dialog-overlay">
        <div class="stamp-dialog-box">
            <h3 style="margin-top: 0; color: #059669; font-size: 20px;">🎉 スタンプ獲得！</h3>
            <p id="stamp-msg" style="font-size: 14px; color: #444; line-height: 1.6; margin-bottom: 20px;"></p>
            <div style="display: flex; gap: 10px;">
                <button onclick="closeStampDialog()" style="flex: 1; padding: 10px; border: none; background: #94a3b8; color: white; border-radius: 10px; font-weight: bold; cursor: pointer;">閉じる</button>
                <button onclick="goToMap()" style="flex: 1; padding: 10px; border: none; background: #f59e0b; color: white; border-radius: 10px; font-weight: bold; cursor: pointer;">マップへGO!</button>
            </div>
        </div>
    </div>

    <script>
    const floorData = {
        '1f': { mind: '1f2.mind', model: 'kougyo2.glb', modelScale: '0.08 0.08 0.08', modelPos: '0 0 0', video: 'denki.mp4' },
        '2f': { mind: '2f2.mind', model: 'syokutyou.glb', modelScale: '1.0 1.0 1.0', modelPos: '0 0 0', video: 'syokutyou.mp4' },
        '3f': { mind: '3f2.mind', model: 'fukude3.glb', modelScale: '1.0 1.0 1.0', modelPos: '0 0 0', video: 'hukude.mp4' },
        '4f': { mind: '4f2.mind', model: 'zyougi.glb', modelScale: '0.08 0.08 0.08', modelPos: '0 -0.3 0', video: 'jgvideo2.mp4' },
        '5f': { mind: '5f2.mind', model: 'syougyou3.glb', modelScale: '0.5 0.5 0.5', modelPos: '0 0 0', video: 'syougyou.mp4' }
    };

    // 階層と動画解放フラグ（スタンプ）のマッピング
    const floorStampMap = {
        '1f': 'stamp-a-flag',
        '2f': 'stamp-e-flag',
        '3f': 'stamp-d-flag',
        '4f': 'stamp-b-flag',
        '5f': 'stamp-f-flag'
    };

    const urlParams = new URLSearchParams(window.location.search);
    let selectedFloor = (urlParams.get('floor') || '4f').toLowerCase();
    if (!floorData[selectedFloor]) selectedFloor = '4f';

    let currentConfig = floorData[selectedFloor];

    window.addEventListener('DOMContentLoaded', () => {
        updateActiveButton(selectedFloor);
        buildARScene();

        // iOS対策: ユーザーが画面を一度タッチした際に動画再生権限を獲得
        const unlock = () => {
            const videoEl = document.getElementById('ar-video-element');
            if (videoEl) {
                videoEl.play().then(() => {
                    videoEl.pause();
                }).catch(() => {});
            }
            window.removeEventListener('touchstart', unlock);
            window.removeEventListener('click', unlock);
        };
        window.addEventListener('touchstart', unlock, { passive: true });
        window.addEventListener('click', unlock, { passive: true });
    });

    function updateActiveButton(floorPrefix) {
        document.querySelectorAll('.floor-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`btn-${floorPrefix}`);
        if (activeBtn) activeBtn.classList.add('active');
    }

    function buildARScene() {
        const container = document.getElementById('ar-container');
        if (!container) {
            console.error("ar-container 要素が見つかりません");
            return;
        }

        const targets = `./${currentConfig.mind}`;

        container.innerHTML = `
        <a-scene
            id="ar-scene"
            mindar-image="imageTargetSrc: ${targets}; autoStart: true; uiLoading: no; uiError: no;"
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights: true"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            <a-assets>
                <video id="ar-video-element" src="${currentConfig.video}" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline muted autoplay></video>
                <a-asset-item id="ar-model-asset" src="${currentConfig.model}"></a-asset-item>
            </a-assets>

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
            <a-entity light="type: ambient; color: #ffffff; intensity: 2.0;"></a-entity>
            <a-entity light="type: directional; color: #ffffff; intensity: 1.0;" position="1 2 1"></a-entity>

            <!-- targetIndex: 0 -> 3Dモデル表示 -->
            <a-entity mindar-image-target="targetIndex: 0" id="target-0">
                <a-entity
                    gltf-model="#ar-model-asset"
                    position="${currentConfig.modelPos}"
                    scale="${currentConfig.modelScale}"
                    rotation="0 0 0">
                </a-entity>
            </a-entity>
            
            <!-- targetIndex: 1 -> 動画表示 -->
            <a-entity mindar-image-target="targetIndex: 1" id="target-1">
                <a-plane
                    id="floor-video-entity"
                    src="#ar-video-element"
                    position="0 0 0" 
                    rotation="0 0 0"
                    width="1.2"
                    height="0.7"
                    material="shader: flat; side: double;">
                </a-plane>
            </a-entity>
        </a-scene>
        `;

        const sceneEl = document.getElementById('ar-scene');
        if (sceneEl.hasLoaded) {
            setupTargetEvents();
        } else {
            sceneEl.addEventListener('loaded', setupTargetEvents);
        }
    }

    function switchFloor(floorPrefix) {
        if (floorPrefix === selectedFloor) return;
        window.location.href = `?floor=${floorPrefix}`;
    }

    function setupTargetEvents() {
        const target0 = document.getElementById('target-0');
        const target1 = document.getElementById('target-1');
        const videoNativeEl = document.getElementById('ar-video-element');

        if (target0) {
            target0.addEventListener('targetFound', () => {
                console.log("3Dモデルマーカー認識成功！");
            });
        }

        if (target1) {
            target1.addEventListener('targetFound', () => {
                console.log("動画マーカー認識成功！");
                
                // 動画ポスター認識時に自動的に動画コレクションを解放（localStorage書き込み）
                const currentStampKey = floorStampMap[selectedFloor];
                if (currentStampKey) {
                    try {
                        localStorage.setItem(currentStampKey, '1');
                        console.log(`動画解放成功: ${currentStampKey}`);
                    } catch (e) {
                        console.warn("localStorage書き込みエラー:", e);
                    }
                }

                if (videoNativeEl) {
                    videoNativeEl.muted = true;
                    videoNativeEl.play().catch(e => {
                        console.log("再生エラー対処:", e);
                        videoNativeEl.setAttribute('muted', 'true');
                        videoNativeEl.play();
                    });
                }
            });

            target1.addEventListener('targetLost', () => {
                console.log("動画マーカー見失い");
                if (videoNativeEl) {
                    videoNativeEl.pause();
                }
            });
        }
    }

    function closeStampDialog() {
        document.getElementById('stamp-dialog').style.display = 'none';
    }

    function goToMap() {
        window.location.href = 'map.html';
    }
    </script>
</body>
</html>
