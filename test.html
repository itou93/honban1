<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>校舎内 WebAR 学科紹介</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body { 
            margin: 0; padding: 0;
            width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; 
            background-color: #000000 !important; 
        }
        #ar-container, a-scene {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important; height: 100dvh !important;
            z-index: 1 !important; overflow: hidden !important;
        }
        .btn-back {
            position: fixed; top: 20px; left: 20px; z-index: 10000;
            background-color: rgba(0, 0, 0, 0.6); color: #ffffff;
            padding: 10px 18px; border-radius: 20px; text-decoration: none;
            font-weight: bold; font-size: 16px; border: 2px solid #ffffff;
        }
        .floor-selector {
            position: fixed; top: 20px; right: 20px; z-index: 10000;
            display: flex; gap: 6px; background: rgba(0, 0, 0, 0.6);
            padding: 6px; border-radius: 20px; border: 2px solid #ffffff;
        }
        .floor-btn {
            background: transparent; color: white; border: none;
            padding: 8px 12px; border-radius: 12px; font-weight: bold;
            font-size: 14px; cursor: pointer;
        }
        .floor-btn.active { background: #10b981; color: white; }
        .mindar-ui-overlay, .mindar-ui-scanning { display: none !important; }

        /* 画面下部の読み取り・スタンプログパネル */
        #soft-log-panel {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            width: 88%; max-width: 360px;
            background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(8px);
            color: #333333; padding: 14px 18px; border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); z-index: 10000;
            border: 1px solid rgba(255, 255, 255, 0.6); text-align: center;
        }
        .log-header {
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 15px; margin-bottom: 6px;
        }
        .log-status-badge {
            font-size: 12px; padding: 3px 10px; border-radius: 12px;
            background: #e2e8f0; color: #475569; font-weight: bold;
        }
        .log-message { font-size: 13px; color: #64748b; line-height: 1.4; margin: 0; }

        .stamp-dialog-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7); z-index: 20000; display: none;
            align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .stamp-dialog-box {
            background: #ffffff; width: 85%; max-width: 340px;
            border-radius: 20px; padding: 24px 20px; text-align: center;
        }
    </style>
</head>
<body>

    <a href="videoMaya.html" class="btn-back">← 戻る</a>

    <div class="floor-selector">
        <button id="btn-1f" class="floor-btn" onclick="switchFloor('1f')">1F</button>
        <button id="btn-2f" class="floor-btn" onclick="switchFloor('2f')">2F</button>
        <button id="btn-3f" class="floor-btn" onclick="switchFloor('3f')">3F</button>
        <button id="btn-4f" class="floor-btn" onclick="switchFloor('4f')">4F</button>
        <button id="btn-5f" class="floor-btn" onclick="switchFloor('5f')">5F</button>
    </div>

    <div id="ar-container"></div>

    <!-- スタンプ・マーカー読み取りログパネル -->
    <div id="soft-log-panel">
        <div class="log-header">
            <span id="log-floor-title">📷 マーカー読み取り</span>
            <span id="log-status" class="log-status-badge">スキャン中</span>
        </div>
        <p id="log-message" class="log-message">ポスターやマーカーにカメラをかざしてみよう！</p>
    </div>

    <!-- スタンプ獲得チャンスダイアログ（マップ誘導用） -->
    <div id="stamp-dialog" class="stamp-dialog-overlay">
        <div class="stamp-dialog-box">
            <h3 style="margin-top: 0; color: #059669; font-size: 20px;">🎉 スタンプ獲得チャンス！</h3>
            <p id="stamp-msg" style="font-size: 14px; color: #444; line-height: 1.6; margin-bottom: 20px;">
                スポットを検出しました！<br>マップを開いてスタンプを押しますか？
            </p>
            <div style="display: flex; gap: 10px;">
                <button onclick="closeStampDialog()" style="flex: 1; padding: 12px; border: none; background: #94a3b8; color: white; border-radius: 12px; font-weight: bold; cursor: pointer;">まだ見にいく</button>
                <button onclick="goToMap()" style="flex: 1; padding: 12px; border: none; background: #f59e0b; color: white; border-radius: 12px; font-weight: bold; cursor: pointer;">マップへGO!</button>
            </div>
        </div>
    </div>

<script>
    // ARコシソウGO 直下配置用パス（mind/ , maya/ , 動画/）
    const floorData = {
        '1f': { name: '1F 電子機械科エリア', mind: 'mind/1f2.mind', model: 'maya/kougyo2.glb', modelScale: '0.08 0.08 0.08', modelPos: '0 0 0', video: '動画/denki.mp4' },
        '2f': { name: '2F 食物調理科エリア', mind: 'mind/2f2.mind', model: 'maya/syokutyou.glb', modelScale: '1.0 1.0 1.0', modelPos: '0 0 0', video: '動画/syokutyou.mp4' },
        '3f': { name: '3F 服飾デザイン科エリア', mind: 'mind/3f2.mind', model: 'maya/fukude3.glb', modelScale: '1.0 1.0 1.0', modelPos: '0 0 0', video: '動画/hukude.mp4' },
        '4f': { name: '4F 情報技術科エリア', mind: 'mind/4f2.mind', model: 'maya/zyougi.glb', modelScale: '0.08 0.08 0.08', modelPos: '0 -0.3 0', video: '動画/jgvideo2.mp4' },
        '5f': { name: '5F 情報処理・流通経済科エリア', mind: 'mind/5f2.mind', model: 'maya/syougyou3.glb', modelScale: '0.5 0.5 0.5', modelPos: '0 0 0', video: '動画/syougyou.mp4' }
    };

    const urlParams = new URLSearchParams(window.location.search);
    let selectedFloor = (urlParams.get('floor') || '4f').toLowerCase();
    if (!floorData[selectedFloor]) selectedFloor = '4f';

    let currentConfig = floorData[selectedFloor];
    let dialogShownThisSession = false;

    let stampTimer = null;
    let countdownInterval = null;

    function updateSoftLog(status, message, isSuccess = true) {
        const statusEl = document.getElementById('log-status');
        const msgEl = document.getElementById('log-message');

        if (statusEl && msgEl) {
            statusEl.textContent = status;
            if (isSuccess) {
                statusEl.style.background = '#d1fae5';
                statusEl.style.color = '#047857';
            } else {
                statusEl.style.background = '#e2e8f0';
                statusEl.style.color = '#475569';
            }
            msgEl.textContent = message;
        }
    }

    function clearStampTimers() {
        if (stampTimer) {
            clearTimeout(stampTimer);
            stampTimer = null;
        }
        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        updateActiveButton(selectedFloor);
        const titleEl = document.getElementById('log-floor-title');
        if (titleEl) titleEl.textContent = `📷 ${selectedFloor.toUpperCase()} マーカー読み取り`;
        updateSoftLog('スキャン中', `${currentConfig.name}のマーカーにかざしてね！`, false);

        buildARScene();

        const unlock = () => {
            const videoEl = document.getElementById('ar-video-element');
            if (videoEl) {
                videoEl.play().then(() => {
                    videoEl.pause();
                }).catch(() => {});
            }
            window.removeEventListener('touchstart', unlock);
            window.removeEventListener('click', unlock);
        };
        window.addEventListener('touchstart', unlock, { passive: true });
        window.addEventListener('click', unlock, { passive: true });
    });

    function updateActiveButton(floorPrefix) {
        document.querySelectorAll('.floor-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`btn-${floorPrefix}`);
        if (activeBtn) activeBtn.classList.add('active');
    }

    function buildARScene() {
        const container = document.getElementById('ar-container');
        if (!container) return;

        const targets = currentConfig.mind;

        container.innerHTML = `
        <a-scene
            id="ar-scene"
            mindar-image="imageTargetSrc: ${targets}; autoStart: true; uiLoading: no; uiError: no;"
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights: true"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            <a-assets>
                <video id="ar-video-element" src="${currentConfig.video}" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline muted autoplay></video>
                <a-asset-item id="ar-model-asset" src="${currentConfig.model}"></a-asset-item>
            </a-assets>

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
            <a-entity light="type: ambient; color: #ffffff; intensity: 2.0;"></a-entity>
            <a-entity light="type: directional; color: #ffffff; intensity: 1.0;" position="1 2 1"></a-entity>

            <!-- targetIndex: 0 -> 3Dモデル表示 -->
            <a-entity mindar-image-target="targetIndex: 0" id="target-0">
                <a-entity
                    gltf-model="#ar-model-asset"
                    position="${currentConfig.modelPos}"
                    scale="${currentConfig.modelScale}"
                    rotation="0 0 0">
                </a-entity>
            </a-entity>
            
            <!-- targetIndex: 1 -> 動画表示 -->
            <a-entity mindar-image-target="targetIndex: 1" id="target-1">
                <a-plane
                    id="floor-video-entity"
                    src="#ar-video-element"
                    position="0 0 0" 
                    rotation="0 0 0"
                    width="1.2"
                    height="0.7"
                    material="shader: flat; side: double;">
                </a-plane>
            </a-entity>
        </a-scene>
        `;

        const sceneEl = document.getElementById('ar-scene');
        if (sceneEl.hasLoaded) {
            setupTargetEvents();
        } else {
            sceneEl.addEventListener('loaded', setupTargetEvents);
        }
    }

    function switchFloor(floorPrefix) {
        if (floorPrefix === selectedFloor) return;
        clearStampTimers();
        window.location.href = `?floor=${floorPrefix}`;
    }

    function triggerStampChance() {
        try {
            localStorage.setItem('detected_floor', selectedFloor);
        } catch (e) {
            console.warn("localStorage書き込みエラー:", e);
        }

        updateSoftLog(
            'スポット検出！',
            `🎉 ${selectedFloor.toUpperCase()}のスタンプが押せます！マップを開こう`,
            true
        );

        if (!dialogShownThisSession) {
            dialogShownThisSession = true;
            const stampMsg = document.getElementById('stamp-msg');
            const stampDialog = document.getElementById('stamp-dialog');
            if (stampMsg && stampDialog) {
                stampMsg.innerHTML = `${currentConfig.name}を検出しました！<br>マップを開いてスタンプを押しますか？`;
                stampDialog.style.display = 'flex';
            }
        }
    }

    function setupTargetEvents() {
        const target0 = document.getElementById('target-0');
        const target1 = document.getElementById('target-1');
        const videoNativeEl = document.getElementById('ar-video-element');

        if (target0) {
            target0.addEventListener('targetFound', () => {
                updateSoftLog('3Dモデル検出！', `✨ ${currentConfig.name}のキャラクターが出現中！`, true);
            });

            target0.addEventListener('targetLost', () => {
                updateSoftLog('スキャン中', `${currentConfig.name}のマーカーにかざしてね！`, false);
            });
        }

        if (target1) {
            target1.addEventListener('targetFound', () => {
                clearStampTimers();

                if (videoNativeEl) {
                    videoNativeEl.muted = true;
                    videoNativeEl.play().catch(() => {
                        videoNativeEl.setAttribute('muted', 'true');
                        videoNativeEl.play();
                    });
                }

                let remainingSec = 10;
                updateSoftLog('動画視聴中...', `🎬 そのままかざし続けてね（あと ${remainingSec} 秒）`, false);

                countdownInterval = setInterval(() => {
                    remainingSec--;
                    if (remainingSec > 0) {
                        updateSoftLog('動画視聴中...', `🎬 そのままかざし続けてね（あと ${remainingSec} 秒）`, false);
                    } else {
                        clearInterval(countdownInterval);
                        countdownInterval = null;
                    }
                }, 1000);

                stampTimer = setTimeout(() => {
                    clearStampTimers();
                    triggerStampChance();
                }, 3000);
            });

            target1.addEventListener('targetLost', () => {
                clearStampTimers();
                updateSoftLog('スキャン中', `${currentConfig.name}のマーカーにかざしてね！`, false);
                if (videoNativeEl) {
                    videoNativeEl.pause();
                }
            });
        }
    }

    function closeStampDialog() {
        document.getElementById('stamp-dialog').style.display = 'none';
    }

    function goToMap() {
        window.location.href = `map.html?floor=${selectedFloor}`;
    }
</script>
</body>
</html>
